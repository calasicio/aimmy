name: Build and Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

env:
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake configure
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles
            ${{ env.BUILD_DIR }}/_deps
          key: ${{ runner.os }}-ninja-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ninja-

      - name: Configure CMake
        run: cmake -B ${{ env.BUILD_DIR }} -S ${{ github.workspace }} -G "Ninja Multi-Config" -DCMAKE_CXX_COMPILER=cl

      - name: Build Debug
        run: cmake --build ${{ env.BUILD_DIR }} --config Debug --parallel

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimmy-debug
          path: ${{ env.BUILD_DIR }}/bin/aimmy.exe
          retention-days: 7

      - name: Build Release
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimmy-release
          path: ${{ env.BUILD_DIR }}/bin/aimmy.exe
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: aimmy-release
          path: ./dist

      - name: Package Release
        shell: pwsh
        run: |
          $name = "aimmy-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path "$name"
          Copy-Item "dist/aimmy.exe" "$name/"
          if (Test-Path "runtime/cs2-dumper.exe") {
            Copy-Item "runtime/cs2-dumper.exe" "$name/"
          }
          Compress-Archive -Path "$name" -DestinationPath "$name.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Aimmy ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            aimmy-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
